name: Check Price Drops and Alert Deals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'  # Corre todos los días a las 18:00 hs de Argentina

jobs:
  check-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core imagemagick

      - name: Install Python libraries
        run: |
          pip install pandas requests "Pillow<10.0.0" "moviepy<2.0" edge-tts

      - name: Run Deals Detector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python detect_deals.py

      - name: Commit price history updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json || true
          git commit -m "chore: update price history [skip ci]" || echo "Sin cambios de precio"
          git push || true
